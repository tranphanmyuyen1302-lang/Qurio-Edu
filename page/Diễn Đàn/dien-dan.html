<div class="forum-app">
<div id="qurio-sidebar-mount"></div>
<div class="forum-main">
<div id="qurio-header-mount"></div>
<main class="forum-content" id="mainContent">
<div class="social-layout">
<section class="social-feed" id="feed">
<section aria-label="Đăng bài viết mới" class="social-composer">
<div class="social-composer-top"><span class="social-avatar">Q</span><button class="social-prompt" id="composerOpen" type="button">Bạn đang nghĩ gì? Hãy chia sẻ với cộng đồng Qurio...</button></div>
<div class="social-composer-tools">
<button id="composerImage" title="▧ Ảnh/Video" type="button">▧ <span>Ảnh/Video</span></button>
<button id="composerDocument" title="▤ Tài liệu" type="button">▤ <span>Tài liệu</span></button>
<button id="composerPoll" title="▥ Thăm dò ý kiến" type="button">▥ <span>Thăm dò ý kiến</span></button>
<button id="composerQuestion" title="ⓘ Câu hỏi" type="button">ⓘ <span>Câu hỏi</span></button>
<button class="social-publish" id="composerButton" title="Đăng bài" type="button">Đăng bài</button>
</div>
</section>
<section aria-label="Chủ đề khám phá" class="story-strip">
<button class="story-card create-story" id="heroPost" type="button"><div class="story-illustration story-create"><img alt="" loading="lazy" src="../../img/Qurio-transparent.png"/></div><span class="story-plus">+</span><strong>Tạo tin</strong></button>
<button class="story-card" data-story="Toán học" type="button"><div class="story-illustration story-math"><span class="story-mark">∑</span></div><strong>Toán học</strong></button>
<button class="story-card" data-story="Tin học" type="button"><div class="story-illustration story-code"><span class="story-mark">&lt;/&gt;</span></div><strong>Tin học</strong></button>
<button class="story-card" data-story="Ngoại ngữ" type="button"><div class="story-illustration story-language"><span class="story-mark">Aa</span></div><strong>Ngoại ngữ</strong></button>
<button class="story-card" data-story="Kinh nghiệm học tập" type="button"><div class="story-illustration story-study"><span class="story-mark">✎</span></div><strong>Kinh nghiệm</strong></button>
<button class="story-card" data-story="Hỏi đáp" type="button"><div class="story-illustration story-qa"><span class="story-mark">?</span></div><strong>Hỏi đáp</strong></button>
</section>
<div class="social-feed-heading"><div><h1>Bảng tin cộng đồng <span>✦</span></h1><p>Nơi những ý tưởng và câu chuyện học tập gặp nhau.</p></div><select aria-label="Sắp xếp bài viết" id="sortPosts"><option value="new">Mới nhất</option><option value="popular">Phổ biến</option><option value="old">Cũ nhất</option></select></div>
<div class="active-filters" hidden="" id="activeFilters"></div>
<div aria-live="polite" id="postList"></div>
</section>
<aside class="social-right">
<section class="social-side-card"><div class="side-heading"><h2>Gợi ý cho bạn</h2><button id="seeTopics" type="button">Xem tất cả ›</button></div>
<p class="side-intro">Khám phá các chủ đề học tập thú vị</p>
<button class="suggested-topic" data-topic="Tin học" type="button"><span class="suggest-avatar blue">⌘</span><span class="suggest-copy"><strong>Tin học</strong><small>Chia sẻ kiến thức lập trình</small></span><span class="follow-pill">Khám phá</span></button>
<button class="suggested-topic" data-topic="Toán học" type="button"><span class="suggest-avatar purple">∑</span><span class="suggest-copy"><strong>Toán học</strong><small>Cùng giải bài tập khó</small></span><span class="follow-pill">Khám phá</span></button>
<button class="suggested-topic" data-topic="Ngoại ngữ" type="button"><span class="suggest-avatar pink">Aa</span><span class="suggest-copy"><strong>Ngoại ngữ</strong><small>Học tiếng Anh và ngôn ngữ</small></span><span class="follow-pill">Khám phá</span></button>
</section>
<section class="social-side-card"><div class="side-heading"><h2>Chủ đề nổi bật 🔥</h2></div><div class="trending-list" id="trendingTopics"></div></section>
<section class="community-banner"><div class="banner-planets">✦ <span>☄</span> ✧</div><h2>Cộng đồng Qurio</h2><p>Học hỏi · Chia sẻ · Cùng tiến bộ</p><div class="banner-book">📖</div></section>
</aside>
</div>
</main>

</div></div><div id="qurio-footer-mount"></div>
<button aria-label="Đóng menu" class="forum-backdrop" hidden="" id="sidebarBackdrop" type="button"></button>
<dialog aria-labelledby="dialogTitle" class="post-dialog" id="postDialog">
<form id="postForm"><div class="dialog-head"><div><span class="eyebrow">DIỄN ĐÀN QURIO</span><h2 id="dialogTitle">Tạo bài viết mới</h2></div><button aria-label="Đóng" class="dialog-close" id="closeDialog" type="button">×</button></div>
<div class="author-line"><span class="user-avatar">Q</span><div><strong id="authorLabel">Thành viên Qurio</strong><small>Chia sẻ với cộng đồng</small></div></div>
<label class="form-label" for="postTitle">Tiêu đề bài viết</label><input id="postTitle" maxlength="140" placeholder="Bạn muốn chia sẻ điều gì?" required=""/>
<label class="form-label" for="postCategory">Chủ đề</label><select id="postCategory" required=""><option value="Hỏi đáp">Hỏi đáp</option><option value="Toán học">Toán học</option><option value="Tin học">Tin học</option><option value="Ngoại ngữ">Ngoại ngữ</option><option value="Kinh nghiệm học tập">Kinh nghiệm học tập</option></select>
<label class="form-label" for="postBody">Nội dung</label><textarea id="postBody" maxlength="5000" minlength="5" placeholder="Viết suy nghĩ, câu hỏi hoặc kiến thức bạn muốn chia sẻ..." required=""></textarea>
<label class="upload-label" for="postImage">▧   Thêm hình ảnh (không bắt buộc)<span>PNG, JPG, WEBP · Tối đa 1 MB</span></label><input accept="image/png,image/jpeg,image/webp" hidden="" id="postImage" type="file"/><div id="imagePreview"></div>
<div class="form-error" id="formError" role="alert"></div><div class="dialog-actions"><button class="cancel-btn" id="cancelDialog" type="button">Hủy</button><button class="primary-btn" type="submit">Đăng bài viết →</button></div>
</form></dialog>
<div aria-live="polite" id="toast" role="status"></div>
<script defer src="../../Chung/qurio-connect.js"></script><script defer src="../../Chung/qurio-sidebar-fix.js"></script>
</body></html>
