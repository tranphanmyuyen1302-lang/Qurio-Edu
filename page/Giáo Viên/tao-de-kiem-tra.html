<script src="../../Chung/qurio-layout.js"></script><script>window.QurioLayout.mountTeacher();</script><script>
const KEY='qurio_exam_page_v2';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let exams=[];try{exams=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(exams))exams=[];}catch{exams=[];}
const save=()=>localStorage.setItem(KEY,JSON.stringify(exams));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const subjects=['Toán','Vật lý','Hóa học','Sinh học','Tin học','Tiếng Anh','Ngữ văn','Lịch sử','Địa lý','Khác'];
const types=[['single','Trắc nghiệm · 1 đáp án'],['multiple','Trắc nghiệm · nhiều đáp án'],['short','Trả lời ngắn'],['paragraph','Tự luận'],['truefalse','Đúng / Sai'],['dropdown','Danh sách thả xuống']];
let draft=null,editing=null,preview=false,toastTimer;
function notice(t){$('toast').textContent=t;$('toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hide'),3300)}
function openDialog(t,h){$('dialogTitle').textContent=t;$('dialogBody').innerHTML=h;$('overlay').classList.remove('hide');document.body.style.overflow='hidden'}
function closeDialog(){$('overlay').classList.add('hide');document.body.style.overflow='';draft=null;editing=null;preview=false}
function fmt(d){return new Date(d).toLocaleDateString('vi-VN')}
function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value;const rows=exams.filter(x=>(f==='all'||x.status===f)&&(x.title+' '+x.subject).toLowerCase().includes(q));$('examRows').innerHTML=rows.map(x=>`<tr><td class="exam-title">${esc(x.title)}</td><td>${esc(x.subject)}</td><td>${x.questions.length}</td><td>${fmt(x.createdAt)}</td><td><span class="badge ${x.status}">${({draft:'Bản nháp',approved:'Đã duyệt',assigned:'Đã giao'})[x.status]||'Bản nháp'}</span></td><td><div class="row-actions"><button class="mini" data-view="${x.id}">Xem</button><button class="mini" data-edit="${x.id}">Sửa</button><button class="mini danger" data-delete="${x.id}">Xóa</button></div></td></tr>`).join('');$('empty').classList.toggle('hide',rows.length!==0);}
function newQuestion(type='single'){return {id:uid(),type,text:'',options:type==='truefalse'?['Đúng','Sai']:['Lựa chọn 1','Lựa chọn 2'],correct:[],answer:'',submissionMode:'typed',allowFileUpload:false,acceptedFiles:'image_pdf',maxFiles:3,points:1,required:true,explanation:''}}
function newExam(){return {id:uid(),title:'',subject:'Vật lý',grade:11,minutes:45,description:'',questions:[newQuestion()],status:'draft',createdAt:new Date().toISOString()}}
function optionsHTML(q){const isMulti=q.type==='multiple',isDrop=q.type==='dropdown';if(['short','paragraph'].includes(q.type))return `<div class="field"><label>Đáp án tham khảo / tiêu chí chấm (chỉ giáo viên thấy)</label><textarea data-q="${q.id}" data-prop="answer" placeholder="Ghi hướng dẫn chấm hoặc những ý chính cần đạt">${esc(q.answer||'')}</textarea></div>${q.type==='paragraph'?`<div class="essay-settings"><div class="essay-settings-head"><span class="setting-icon">📷</span><div><strong>Hình thức học sinh nộp bài</strong><small>Cho phép học sinh làm bài trên giấy, chụp ảnh hoặc gửi PDF để giáo viên chấm</small></div></div><div class="mode-choices"><label class="mode-choice"><input type="radio" name="submission-${q.id}" data-submission="${q.id}" value="typed" ${(q.submissionMode||'typed')==='typed'?'checked':''}><span><b>⌨️ Nhập trực tiếp</b><small>Học sinh gõ câu trả lời trên Qurio</small></span></label><label class="mode-choice"><input type="radio" name="submission-${q.id}" data-submission="${q.id}" value="file" ${q.submissionMode==='file'?'checked':''}><span><b>📎 Tải bài làm</b><small>Chụp ảnh bài trên giấy hoặc tải PDF lên</small></span></label><label class="mode-choice"><input type="radio" name="submission-${q.id}" data-submission="${q.id}" value="both" ${q.submissionMode==='both'?'checked':''}><span><b>✨ Cả hai cách</b><small>Học sinh tự chọn cách nộp thuận tiện</small></span></label></div><div class="essay-file-note"><span>🖼️ JPG · PNG · WEBP</span><span>📄 PDF</span><span>🔒 Tối đa 3 tệp / câu, 10 MB / tệp</span></div></div>`:''}`;
return `<div class="question-hint">${isMulti?'Chọn tất cả đáp án đúng':'Đánh dấu đáp án đúng ở bên trái mỗi lựa chọn'}</div>${q.options.map((o,i)=>`<div class="answer-option"><input aria-label="Đáp án đúng" type="${isMulti?'checkbox':'radio'}" name="correct-${q.id}" data-correct="${q.id}" data-index="${i}" ${q.correct.includes(i)?'checked':''}><input type="text" aria-label="Nội dung lựa chọn" data-option="${q.id}" data-index="${i}" value="${esc(o)}" ${q.type==='truefalse'?'readonly':''}><button class="option-remove" type="button" data-remove-option="${q.id}" data-index="${i}" ${q.type==='truefalse'||q.options.length<=2?'disabled':''} aria-label="Xóa lựa chọn">×</button></div>`).join('')}${q.type!=='truefalse'?`<button class="btn" type="button" data-add-option="${q.id}">＋ Thêm lựa chọn</button>`:''}`}
function questionHTML(q,i){return `<article class="question-editor" data-question="${q.id}"><div class="question-title-row"><span class="question-number">Câu ${i+1}</span><select class="question-type" data-type="${q.id}" aria-label="Loại câu hỏi">${types.map(([v,n])=>`<option value="${v}" ${q.type===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Nội dung câu hỏi *</label><textarea data-q="${q.id}" data-prop="text" placeholder="Nhập câu hỏi của bạn...">${esc(q.text)}</textarea></div><div data-options-for="${q.id}">${optionsHTML(q)}</div><div class="field"><label>Giải thích / hướng dẫn chấm (tùy chọn)</label><textarea data-q="${q.id}" data-prop="explanation" placeholder="Giúp học sinh hiểu đáp án...">${esc(q.explanation)}</textarea></div><div class="question-actions"><label style="margin-right:auto">Điểm <input type="number" min="0" max="100" step="0.5" value="${q.points}" data-q="${q.id}" data-prop="points" style="width:65px;padding:8px;border:1px solid #e3dbf2;border-radius:8px"></label><label><input type="checkbox" data-q="${q.id}" data-prop="required" ${q.required?'checked':''}> Bắt buộc</label><button class="btn" data-copy="${q.id}" type="button">⧉ Nhân bản</button><button class="btn" data-up="${q.id}" type="button">↑</button><button class="btn" data-down="${q.id}" type="button">↓</button><button class="btn" data-remove="${q.id}" type="button">🗑</button></div></article>`}
function builder(){const h=`<div class="builder-paper"><div class="builder-top"><h3>✎ Thiết kế bài kiểm tra</h3><p>Biểu mẫu linh hoạt · Tùy chọn loại câu hỏi · Lưu và quản lý bản nháp</p></div><div class="builder-info"><div class="field"><label>Tên bài kiểm tra *</label><input id="bTitle" value="${esc(draft.title)}" placeholder="Ví dụ: Kiểm tra 15 phút – Dao động điều hòa"></div><div class="field"><label>Mô tả / hướng dẫn làm bài</label><textarea id="bDescription" placeholder="Nhập hướng dẫn cho học sinh">${esc(draft.description||'')}</textarea></div><div class="form-grid"><div class="field"><label>Môn học</label><select id="bSubject">${subjects.map(s=>`<option ${s===draft.subject?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Khối lớp</label><select id="bGrade">${[10,11,12].map(g=>`<option ${g===Number(draft.grade)?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Thời gian (phút)</label><input id="bMinutes" type="number" min="1" max="240" value="${draft.minutes}"></div><div class="field"><label>Số câu hỏi</label><input readonly value="${draft.questions.length} câu" style="background:#f6f3fc"></div></div></div><div id="questionEditors">${draft.questions.map(questionHTML).join('')}</div><div class="builder-toolbar"><div><button class="btn" id="addQuestion">＋ Thêm câu hỏi</button><span style="color:#8d80a2;font-size:11px;margin-left:8px">${draft.questions.length} câu · ${draft.questions.reduce((s,q)=>s+Number(q.points||0),0)} điểm</span></div><div><button class="btn" id="preview">👁 Xem trước</button> <button class="btn primary" id="saveDraft">💾 Lưu bản nháp</button></div></div></div>`;openDialog(editing?'Chỉnh sửa đề kiểm tra':'Soạn đề thủ công',h)}
function sync(){if(!draft)return;const title=$('bTitle');if(title){draft.title=title.value;draft.description=$('bDescription').value;draft.subject=$('bSubject').value;draft.grade=Number($('bGrade').value);draft.minutes=Number($('bMinutes').value);}document.querySelectorAll('[data-q][data-prop]').forEach(el=>{const q=draft.questions.find(x=>x.id===el.dataset.q);if(q)q[el.dataset.prop]=el.type==='checkbox'?el.checked:el.dataset.prop==='points'?Number(el.value):el.value});document.querySelectorAll('[data-option]').forEach(el=>{const q=draft.questions.find(x=>x.id===el.dataset.option);if(q)q.options[Number(el.dataset.index)]=el.value});document.querySelectorAll('[data-correct]').forEach(el=>{const q=draft.questions.find(x=>x.id===el.dataset.correct),i=Number(el.dataset.index);if(!q)return;if(el.checked&&!q.correct.includes(i))q.correct.push(i);if(!el.checked)q.correct=q.correct.filter(v=>v!==i)})}
function openBuilder(id=null){editing=id;const x=exams.find(e=>e.id===id);draft=x?JSON.parse(JSON.stringify(x)):newExam();builder()}
function redraw(){sync();builder()}
function validate(){if(!draft.title.trim()){notice('Vui lòng nhập tên đề kiểm tra.');return false}if(!draft.questions.length){notice('Cần có ít nhất một câu hỏi.');return false}if(draft.questions.some(q=>!q.text.trim())){notice('Vui lòng nhập nội dung cho tất cả câu hỏi.');return false}if(draft.questions.some(q=>['single','multiple','truefalse','dropdown'].includes(q.type)&&(!q.correct.length||q.options.some(o=>!o.trim())))){notice('Kiểm tra các lựa chọn và đáp án đúng.');return false}return true}
function saveDraft(){sync();if(!validate())return;const idx=exams.findIndex(x=>x.id===draft.id);if(idx>=0)exams[idx]=draft;else exams.push(draft);save();closeDialog();render();notice('Đã lưu bản nháp.');}
function previewExam(){sync();const body=`<div class="builder-paper"><div class="builder-top"><h3>${esc(draft.title||'Bài kiểm tra chưa đặt tên')}</h3><p>${esc(draft.description||'Kiểm tra nội dung trước khi duyệt')}</p></div>${draft.questions.map((q,i)=>`<div class="preview-card"><h3>${i+1}. ${esc(q.text||'(Chưa nhập câu hỏi)')} <span class="required-pill">${q.points} điểm</span></h3>${q.type==='paragraph'?`<div class="student-submission"><span class="submission-label">📚 Học sinh sẽ trả lời theo hình thức:</span>${q.submissionMode!=='file'?`<div class="field"><label>Nhập bài làm</label><textarea placeholder="Học sinh viết câu trả lời tại đây..."></textarea></div>`:''}${q.submissionMode==='file'||q.submissionMode==='both'?`<label class="student-drop">📎 Tải ảnh bài làm hoặc file PDF <input class="student-essay-file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.jpg,.jpeg,.png,.webp,.pdf" multiple data-question-id="${q.id}"><small>JPG · PNG · WEBP · PDF · tối đa 3 tệp, 10 MB/tệp</small></label><div class="student-file-list" data-file-list="${q.id}">Chưa chọn tệp</div>`:''}</div>`:q.type==='short'?`<div class="field"><input placeholder="Học sinh nhập câu trả lời ngắn"></div>`:q.options.map(o=>`<div class="preview-option">${q.type==='multiple'?'☐':'◯'} &nbsp; ${esc(o)}</div>`).join('')}</div>`).join('')}<div class="dialog-actions"><button class="btn primary" id="backBuilder">← Quay lại chỉnh sửa</button></div></div>`;openDialog('Xem trước bài kiểm tra',body)}
function viewExam(id){const x=exams.find(v=>v.id===id);if(!x)return;draft=JSON.parse(JSON.stringify(x));editing=id;previewExam()}
function pdfModal(){openDialog('Tạo đề từ tài liệu PDF',`<div class="builder-paper"><div class="builder-top"><h3>📄 Chuyển PDF thành bài kiểm tra</h3><p>AI phân tích tài liệu và tự nhận diện câu hỏi, đáp án, dạng câu hỏi có trong file.</p></div><div class="builder-info"><label class="pdf-drop" for="pdfFile"><span class="upload-emoji">📂</span><strong id="pdfFileName">Nhấn để chọn tài liệu PDF</strong><small>Hỗ trợ PDF tối đa 10 MB · Không cần nhập số câu dự kiến</small><input type="file" id="pdfFile" accept=".pdf,application/pdf"></label><div class="pdf-steps"><div class="pdf-step"><b>① 📖</b>AI đọc nội dung PDF</div><div class="pdf-step"><b>② ✨</b>Nhận diện câu hỏi và đáp án</div><div class="pdf-step"><b>③ 📝</b>Giáo viên kiểm tra và duyệt đề</div></div><div class="dialog-actions"><button class="btn primary" id="pdfProcess">✨ Phân tích tài liệu</button></div></div></div>`)}
function aiModal(){openDialog('Tạo đề bằng AI',`<div class="builder-paper"><div class="builder-top"><h3>✨ AI Exam Studio</h3><p>Biên soạn đề từ chủ đề học hoặc từ bản đặc tả / ma trận kiểm tra của giáo viên.</p></div><div class="builder-info"><div class="ai-source-switch"><label class="ai-source"><input type="radio" name="aiSource" value="topic" checked><span>✍️ Theo chủ đề</span></label><label class="ai-source"><input type="radio" name="aiSource" value="spec"><span>📑 Theo đặc tả / ma trận đề</span></label></div><div id="aiTopicFields"><div class="form-grid"><div class="field"><label>Môn học</label><select id="aiSubject">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Chủ đề</label><input id="aiTopic" placeholder="Ví dụ: Dao động điều hòa"></div><div class="field"><label>Số câu hỏi</label><input id="aiCount" type="number" min="1" max="100" value="20"></div><div class="field"><label>Mức độ</label><select id="aiLevel"><option>Hỗn hợp</option><option>Nhận biết</option><option>Thông hiểu</option><option>Vận dụng</option></select></div></div></div><div id="aiSpecFields" class="hide"><div class="spec-intro"><span>📋</span><div><b>Tạo đề bám sát bản đặc tả</b><p>Đọc nội dung đặc tả và dùng AI tạo câu hỏi tham khảo. Giáo viên kiểm tra lại số câu và mức độ theo ma trận trước khi duyệt.</p></div></div><div class="field"><label>Tải bản đặc tả / ma trận đề</label><label class="spec-drop" for="aiSpecFile"><span>☁️</span><strong id="aiSpecFileName">Chọn PDF, Word hoặc file văn bản</strong><small>PDF · DOCX · TXT · tối đa 10 MB</small><input type="file" id="aiSpecFile" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"></label><div id="aiSpecParseInfo" role="status" aria-live="polite" style="font-size:12px;padding:9px 3px;color:#7153b4">File Word sẽ được đọc trực tiếp trên trình duyệt trước khi tạo đề.</div></div><div class="field"><label>Hoặc dán nội dung đặc tả</label><textarea id="aiSpecText" rows="5" placeholder="Ví dụ: Chương 2 – Điện trường; 40% nhận biết, 30% thông hiểu, 30% vận dụng; 12 câu trắc nghiệm, 2 câu tự luận..."> </textarea></div><div class="form-grid"><div class="field"><label>Môn học</label><select id="aiSpecSubject">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Khối lớp</label><select id="aiSpecGrade"><option>10</option><option selected>11</option><option>12</option></select></div><div class="field"><label>Số câu dự kiến</label><input id="aiSpecCount" type="number" min="1" max="60" value="20"></div></div><div class="spec-process"><div><span>①</span> Đọc đặc tả</div><div><span>②</span> Phân tích ma trận</div><div><span>③</span> Tạo đề và đáp án</div><div><span>④</span> Giáo viên duyệt</div></div></div><div class="dialog-actions"><button class="btn primary" id="aiStart">✨ Tạo đề bằng AI</button></div></div></div>`)}
function selectedAiMode(){return document.querySelector('input[name="aiSource"]:checked')?.value||'topic'}
function validateSpecInput(){const file=$('aiSpecFile')?.files?.[0];const text=$('aiSpecText')?.value.trim();if(!file&&!text){notice('Hãy tải bản đặc tả hoặc dán nội dung đặc tả.');return false;}if(file){if(!/\.(pdf|docx|txt)$/i.test(file.name)){notice('Bản đặc tả chỉ hỗ trợ PDF, DOCX hoặc TXT.');return false;}if(file.size>10*1024*1024){notice('Bản đặc tả vượt giới hạn 10 MB.');return false;}}return true;}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const a=t.dataset.action;if(a==='manual')openBuilder();if(a==='pdf')pdfModal();if(a==='ai')aiModal();if(t.id==='addQuestion'){sync();draft.questions.push(newQuestion());builder()}if(t.id==='saveDraft')saveDraft();if(t.id==='preview')previewExam();if(t.id==='backBuilder')builder();if(t.id==='pdfProcess'){const f=$('pdfFile').files[0];if(!f)return notice('Vui lòng chọn file PDF.');if(!f.name.toLowerCase().endsWith('.pdf')||f.size>10*1024*1024)return notice('Chỉ chấp nhận PDF không quá 10 MB.');processWithIntegration('pdf', {file:f})}if(t.id==='aiStart'){if(selectedAiMode()==='spec'){if(validateSpecInput())processWithIntegration('spec', {file:$('aiSpecFile')?.files?.[0]||null, text:$('aiSpecText')?.value.trim()||'', subject:$('aiSpecSubject')?.value, grade:$('aiSpecGrade')?.value, count:Number($('aiSpecCount')?.value||20)})}else processWithIntegration('topic', {subject:$('aiSubject')?.value, topic:$('aiTopic')?.value, count:Number($('aiCount')?.value), level:$('aiLevel')?.value});}const id=t.dataset.view;if(id)viewExam(id);if(t.dataset.edit)openBuilder(t.dataset.edit);if(t.dataset.delete){const x=exams.find(v=>v.id===t.dataset.delete);if(x&&confirm('Xóa đề "'+x.title+'"?')){exams=exams.filter(v=>v.id!==x.id);save();render();notice('Đã xóa đề.')}}if(t.dataset.addOption){sync();const q=draft.questions.find(q=>q.id===t.dataset.addOption);if(q&&q.options.length<12){q.options.push('Lựa chọn '+(q.options.length+1));builder()}}if(t.dataset.removeOption){sync();const q=draft.questions.find(q=>q.id===t.dataset.removeOption),i=Number(t.dataset.index);if(q&&q.options.length>2){q.options.splice(i,1);q.correct=q.correct.filter(v=>v!==i).map(v=>v>i?v-1:v);builder()}}if(t.dataset.type){return}if(t.dataset.copy){sync();const q=draft.questions.find(q=>q.id===t.dataset.copy);if(q){const idx=draft.questions.indexOf(q);draft.questions.splice(idx+1,0,{...JSON.parse(JSON.stringify(q)),id:uid()});builder()}}if(t.dataset.remove){sync();if(draft.questions.length===1)return notice('Đề phải có ít nhất một câu hỏi.');draft.questions=draft.questions.filter(q=>q.id!==t.dataset.remove);builder()}if(t.dataset.up||t.dataset.down){sync();const id=t.dataset.up||t.dataset.down,i=draft.questions.findIndex(q=>q.id===id),j=i+(t.dataset.up?-1:1);if(j>=0&&j<draft.questions.length){[draft.questions[i],draft.questions[j]]=[draft.questions[j],draft.questions[i]];builder()}}});
document.addEventListener('change',e=>{if(e.target.dataset.type){sync();const q=draft.questions.find(q=>q.id===e.target.dataset.type);if(q){q.type=e.target.value;q.options=q.type==='truefalse'?['Đúng','Sai']:['Lựa chọn 1','Lựa chọn 2'];q.correct=[];builder()}}if(e.target.id==='pdfFile'){$('pdfFileName').textContent=e.target.files[0]?.name||'Nhấn để chọn tài liệu PDF'}if(e.target.name==='aiSource'){const spec=e.target.value==='spec';$('aiSpecFields')?.classList.toggle('hide',!spec);$('aiTopicFields')?.classList.toggle('hide',spec);if($('aiStart'))$('aiStart').textContent=spec?'✨ Phân tích đặc tả & tạo đề':'✨ Tạo đề bằng AI';}if(e.target.id==='aiSpecFile'){$('aiSpecFileName').textContent=e.target.files[0]?.name||'Chọn PDF, Word hoặc file văn bản';}if(e.target.dataset.submission){sync();const q=draft.questions.find(x=>x.id===e.target.dataset.submission);if(q){q.submissionMode=e.target.value;q.allowFileUpload=e.target.value!=='typed';builder();}}if(e.target.matches('.student-essay-file')){const files=[...e.target.files];const display=document.querySelector(`[data-file-list="${e.target.dataset.questionId}"]`);if(files.length>3||files.some(f=>f.size>10*1024*1024)||files.some(f=>!(/\.(jpe?g|png|webp|pdf)$/i).test(f.name))){e.target.value='';if(display)display.textContent='Tệp không hợp lệ. Chỉ nhận tối đa 3 ảnh/PDF, mỗi tệp tối đa 10 MB.';return notice('Hãy chọn tối đa 3 ảnh/PDF, mỗi tệp ≤ 10 MB.');}if(display)display.textContent=files.length?files.map(f=>`✓ ${f.name}`).join(' · '):'Chưa chọn tệp';}});

// Điểm tích hợp cho backend Qurio, giữ nguyên giao diện khi thay đổi nguồn dữ liệu.
// Trong dự án chính: window.QurioExamAPI = { pdf: async data => ..., spec: async data => ..., topic: async data => ... }
async function processWithIntegration(mode, payload) {
    const handler = window.QurioExamAPI && window.QurioExamAPI[mode];
    if (typeof handler !== 'function') {
        notice('Không thể xử lý yêu cầu lúc này.');
        return;
    }
    const startButton = $('aiStart') || $('pdfProcess');
    if (startButton?.disabled) return;
    if (startButton) { startButton.disabled = true; startButton.textContent = '⏳ AI đang xử lý tài liệu...'; }
    try {
        const result = await handler(payload);
        if (!result || !Array.isArray(result.questions) || result.questions.length === 0) {
            notice('Không nhận được câu hỏi hợp lệ.');
            return;
        }
        const generated = newExam();
        generated.title = String(result.title || 'Đề kiểm tra mới');
        generated.subject = String(result.subject || payload.subject || generated.subject);
        generated.questions = result.questions.map(q => ({
            ...newQuestion(), ...q, id:uid(),
            options:Array.isArray(q.options) ? q.options : [],
            correct:Array.isArray(q.correct) ? q.correct : []
        }));
        draft = generated;
        editing = null;
        builder();
        notice('Đã tạo bản nháp. Hãy kiểm tra câu hỏi và đáp án.');
    } catch (err) {
        console.error('QurioExamAPI:',err);
        notice((err && err.message) || 'Không thể xử lý yêu cầu. Vui lòng thử lại.');
    } finally {
        if (startButton?.isConnected) {
            startButton.disabled = false;
            startButton.textContent = mode === 'spec' ? '✨ Phân tích đặc tả & tạo đề' : '✨ Tạo đề bằng AI';
        }
    }
}

function close(){menu.hidden=true;trigger.setAttribute('aria-expanded','false')}
trigger.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden))});
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!trigger.contains(e.target))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  window.QurioExamAPI = window.QurioExamAPI || {};

  // Thay chức năng tạo đề theo đặc tả cũ
  window.QurioExamAPI.spec = async function (data) {
    if (!window.QurioAuth?.request) {
      throw new Error("Chưa kết nối được tài khoản Qurio.");
    }

    const subject = String(data.subject || "Khác").trim();
    const grade = Number(data.grade || 11);
    const count = Number(data.count || 20);

    if (!Number.isInteger(count) || count < 1 || count > 40) {
      throw new Error("Hãy chọn từ 1 đến 40 câu hỏi.");
    }

    let specText = String(data.text || "").trim();

    // Đọc nội dung từ file DOCX, PDF hoặc TXT
    if (data.file) {
      if (!window.QurioSpecReader?.extract) {
        throw new Error("Chưa tải được bộ đọc tài liệu.");
      }

      const extracted = String(
        await window.QurioSpecReader.extract(data.file)
      ).trim();

      if (!extracted) {
        throw new Error(
          "Không đọc được nội dung tài liệu. Hãy dán bản đặc tả vào ô văn bản."
        );
      }

      // Không ghép trùng phần đã tự điền
      if (!specText || extracted.includes(specText)) {
        specText = extracted;
      } else if (!specText.includes(extracted)) {
        specText = extracted + "\n" + specText;
      }
    }

    if (specText.length < 40) {
      throw new Error(
        "Bản đặc tả cần ít nhất 40 ký tự nội dung."
      );
    }

    if (specText.length > 14000) {
      console.warn(
        "Bản đặc tả vượt 14.000 ký tự, cần kiểm tra phần bị cắt."
      );
      specText = specText.slice(0, 14000);
    }

    const info = document.getElementById("aiSpecParseInfo");
    if (info) {
      info.textContent =
        "Đã đọc " + specText.length +
        " ký tự. AI đang phân tích ma trận...";
    }

    console.log("QURIO SPEC API V2", {
      action: "aiGenerateExamSpec",
      subject,
      grade,
      count,
      textLength: specText.length
    });

    // Gọi API chuyên xử lý bản đặc tả
    const result = await window.QurioAuth.request(
      "aiGenerateExamSpec",
      {
        subject,
        grade,
        count,
        specText,
        sourceName: data.file?.name || "Nội dung nhập"
      }
    );

    if (!Array.isArray(result.questions)) {
      throw new Error(
        result.message || "AI không trả về danh sách câu hỏi."
      );
    }

    // Chuyển dữ liệu AI thành định dạng đề Qurio
    const questions = result.questions.map(q => {
      const options = Array.isArray(q.options)
        ? q.options.map(String)
        : ["A", "B", "C", "D"].map(
            key => String(q.options?.[key] || "")
          );

      let answerIndex = -1;

      if (typeof q.answer === "number") {
        answerIndex = q.answer;
      } else if (typeof q.answer === "string") {
        const letter = q.answer.trim().toUpperCase();
        if (/^[A-D]$/.test(letter)) {
          answerIndex = letter.charCodeAt(0) - 65;
        } else {
          answerIndex = options.findIndex(
            option => option.trim() === q.answer.trim()
          );
        }
      }

      return {
        type: "single",
        text: String(q.prompt || q.question || q.text || ""),
        options,
        correct: answerIndex >= 0 && answerIndex < options.length
          ? [answerIndex]
          : [],
        explanation: String(q.explanation || ""),
        points: 1,
        required: true
      };
    }).filter(q =>
      q.text.trim() &&
      q.options.length === 4 &&
      q.correct.length === 1
    );

    if (!questions.length) {
      throw new Error("AI chưa tạo được câu hỏi hợp lệ.");
    }

    if (info) {
      info.textContent =
        "Đã tạo " + questions.length +
        " câu hỏi. Giáo viên cần kiểm tra trước khi duyệt.";
    }

    return {
      title: "Đề kiểm tra theo đặc tả - " +
        subject + " " + grade,
      subject,
      grade,
      questions
    };
  };

  console.log("QURIO: ĐÃ KÍCH HOẠT TẠO ĐỀ ĐẶC TẢ V2");
});
</script>
